name: barrierefri

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barrierefri
      POSTGRES_USER: barrierefri
      POSTGRES_PASSWORD: barrierefri
    ports:
      # Non-default host port so it doesn't clash with a local PostgreSQL. Power BI connects here.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barrierefri -d barrierefri"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for Azure Blob Storage, used for report photos.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    # --skipApiVersionCheck: the Azure SDK in the API can be newer than this Azurite release.
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - blobdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/barrierefri-realm.json:/opt/keycloak/data/import/barrierefri-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=barrierefri;Username=barrierefri;Password=barrierefri
      ConnectionStrings__Storage: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      Auth__Authority: http://localhost:8082/realms/barrierefri
      Auth__MetadataAddress: http://keycloak:8080/realms/barrierefri/.well-known/openid-configuration
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5080:8080"
    # The aspnet runtime image has no curl or wget, so this asks /health over
    # bash's /dev/tcp and passes only on an HTTP 200.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # migrations and demo data run on startup
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      azurite:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "3000:80"
    # 127.0.0.1, not localhost: localhost resolves to ::1 in this image and
    # nginx listens on IPv4 only.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  blobdata:
